services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sva
      POSTGRES_PASSWORD: sva_password
      POSTGRES_DB: sva_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
